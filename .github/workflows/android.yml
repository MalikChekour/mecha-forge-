name: Build Android (APK)

# Cloud build: installs Godot 4.3 + Android SDK on GitHub's runners and exports a
# debug-signed APK you can sideload to test. No local Android SDK needed.
# Run it from the Actions tab ("Run workflow") or on every push to main/master.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  GODOT_VERSION: "4.3"
  PROJECT_PATH: game

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform + build-tools
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Generate debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the Android SDK / JDK / keystore
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project (generate .godot cache)
        run: ./godot --headless --path "${PROJECT_PATH}" --import 2>&1 | tail -n 20 || true

      - name: Export Android APK (debug-signed)
        run: |
          mkdir -p "${PROJECT_PATH}/build"
          ./godot --headless --path "${PROJECT_PATH}" --export-debug "Android" build/mecha-forge.apk 2>&1 | tail -n 40
          ls -lh "${PROJECT_PATH}/build/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mecha-forge-apk
          path: ${{ env.PROJECT_PATH }}/build/mecha-forge.apk
          if-no-files-found: error
